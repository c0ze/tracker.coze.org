name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          # everything except .git / workflows / README
          shopt -s extglob
          cp -r !(._site|.git|.github|_site|README.md) _site/ 2>/dev/null || true
          # explicit copy for reliability
          rm -rf _site
          mkdir _site
          cp index.html CNAME _site/
          cp -r assets listen player demos vendor tools songs sid _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
