<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cozy-tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem 1.25rem; background: #0d0f14; color: #d7dae0;
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  #tracker { flex: 1; min-height: 0; }
  #loader { display: contents; }
  #drop { position: fixed; inset: 1rem; display: none; align-items: center; justify-content: center;
    background: rgba(13,15,20,.85); border: 2px dashed #4fc1ff; border-radius: 8px;
    color: #4fc1ff; font-size: 1.1rem; pointer-events: none; }
</style>
</head>
<body>
<!-- The song box sits in the tracker's toolbar; the tracker itself is player/tracker.js. -->
<span id="loader">
  <input type="text" id="url" aria-label="song URL (.it or .json)" value="../songs/lantern_walk.json" style="flex:1; min-width:150px">
  <button id="loadUrl">Load</button>
  <input type="file" id="file" aria-label="open module or json song" accept=".it,.xm,.mod,.s3m,.json,.sid" style="font-size:11px; max-width:180px">
</span>
<div id="tracker"></div>
<div id="drop">drop a module</div>

<script type="module">
import { mountTracker } from './tracker.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// ?muted=1: every engine is created at volume 0 (agents and tests check the page this way).
// ▶ with nothing loaded loads the song box first.
const tracker = mountTracker($('tracker'), {
  mode: 'public', muted: params.get('muted') === '1', loadForPlay: () => loadUrl($('url').value),
});
tracker.toolbar.append($('loader'));
window.__tracker = tracker; // debug handle

// Loading never plays: .json songs compile and open for editing, modules wait for ▶.
async function fetchOk(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res;
}
function loadUrl(url) {
  if (!url) return;
  const res = fetchOk(url);
  if (/\.json$/i.test(url)) return tracker.load(res.then((r) => r.json()), { name: url.split('/').pop() });
  return tracker.loadModule(res.then((r) => r.arrayBuffer()), url);
}
function loadFile(f) {
  const buf = f.arrayBuffer();
  if (/\.json$/i.test(f.name)) return tracker.load(buf.then((b) => JSON.parse(new TextDecoder().decode(b))), { name: f.name });
  return tracker.loadModule(buf, f.name);
}
const confirmDiscard = () => !tracker.doc?.dirty || confirm('Discard unsaved edits?');
$('loadUrl').onclick = () => { if (confirmDiscard()) loadUrl($('url').value); };
$('file').onchange = (e) => { const f = e.target.files[0]; if (f && confirmDiscard()) loadFile(f); };
addEventListener('beforeunload', (e) => { if (tracker.doc?.dirty) e.preventDefault(); });
const drop = $('drop');
addEventListener('dragover', (e) => { e.preventDefault(); drop.style.display = 'flex'; });
addEventListener('dragleave', (e) => { if (!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', (e) => {
  e.preventDefault(); drop.style.display = 'none';
  const f = e.dataTransfer.files[0];
  if (f && confirmDiscard()) loadFile(f);
});

// Deep link: /player/?song=../demos/night_bus.it (the landing page's links) loads that song
// silently; ▶ plays it, waiting for the load if it is still in flight.
const q = params.get('song');
if (q) { $('url').value = q; loadUrl(q); }
</script>
</body>
</html>
